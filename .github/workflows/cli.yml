name: standalone CLI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install CLI build dependencies only
        working-directory: cli
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck the source-only dependency graph
        working-directory: cli
        run: npm run typecheck
      - name: Build and exercise the standalone CLI
        working-directory: cli
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: grok-reconstructed-cli-node-${{ matrix.node }}
          path: |
            cli/dist/main.mjs
            cli/dist/provenance.json
          if-no-files-found: error
